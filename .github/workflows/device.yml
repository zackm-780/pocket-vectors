name: device

# Builds the RG40XXH (aarch64, glibc 2.31) PortMaster packages inside the Debian 11 image from
# flightsim/tools/docker/, checks them (GLIBC <= 2.31, dependency whitelist, layout) and uploads them
# twice: unpacked as flightsim-sdcard-PORTS (download, unzip once, copy everything into Roms/PORTS on
# the SD card) and as the PortMaster zips (flightsim-device-zips).

on:
  push:
    paths:
      - "flightsim/cmake/**"
      - "flightsim/tools/docker/**"
      - "flightsim/tools/probe/**"
      - "flightsim/tools/build_device.sh"
      - "flightsim/port/**"
      - "flightsim/src/**"
      - "flightsim/CMakeLists.txt"
      - "flightsim/assets/**"
      - ".github/workflows/device.yml"
  pull_request:
    paths:
      - "flightsim/cmake/**"
      - "flightsim/tools/docker/**"
      - "flightsim/tools/probe/**"
      - "flightsim/tools/build_device.sh"
      - "flightsim/port/**"
      - "flightsim/src/**"
      - "flightsim/CMakeLists.txt"
      - "flightsim/assets/**"
      - ".github/workflows/device.yml"
  workflow_dispatch:
    inputs:
      require_main:
        description: "Fail if the game itself cannot be built (on by default since WP-00 landed)"
        type: boolean
        default: true

jobs:
  device-zip:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax check
        working-directory: flightsim
        run: |
          for f in tools/build_device.sh tools/docker/*.sh port/*.sh; do bash -n "$f"; done
          bash -n port/FlightSim.sh
          bash -n tools/probe/port/FlightSimProbe.sh
          shellcheck -S warning tools/build_device.sh tools/docker/*.sh port/package_port.sh port/check_package.sh \
            port/test_launch_scripts.sh

      - name: Launch scripts pick the right port folder
        working-directory: flightsim
        run: port/test_launch_scripts.sh

      - name: Build and check the device packages (Docker, Debian 11)
        working-directory: flightsim
        env:
          # WP-00 has landed: a broken game build fails CI (a manual run can opt out).
          REQUIRE_MAIN: ${{ github.event.inputs.require_main == 'false' && '0' || '1' }}
        run: tools/build_device.sh --docker

      - name: Show package contents
        working-directory: flightsim
        run: |
          ls -la dist
          for z in dist/*.zip; do echo "== $z"; unzip -l "$z" | grep -v "jsbsim/" ; done

      # Both ports unpacked side by side: FlightSim.sh, flightsim/, FlightSimProbe.sh, flightsimprobe/.
      - name: Unpack the ports for the SD card
        working-directory: flightsim
        run: |
          rm -rf dist/sdcard-PORTS && mkdir -p dist/sdcard-PORTS
          for z in dist/*.zip; do unzip -q "$z" -d dist/sdcard-PORTS; done
          ls -la dist/sdcard-PORTS

      - name: Upload the SD card folder
        uses: actions/upload-artifact@v4
        with:
          name: flightsim-sdcard-PORTS
          path: flightsim/dist/sdcard-PORTS/
          if-no-files-found: error

      - name: Upload device zips
        uses: actions/upload-artifact@v4
        with:
          name: flightsim-device-zips
          path: flightsim/dist/*.zip
          if-no-files-found: error
