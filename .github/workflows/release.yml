name: release

# On a v* tag, build the RG40XXH game (no probe, no data pack) and attach it to the GitHub
# Release, together with the pdx_oth data pack from a datapack workflow run (DATA_RUN_ID and
# DATA_ARTIFACT below) and, from 1.2.2, one SD-card zip of both (tools/sdcard/make_sdcard_zip.py).
# From 1.3 (owner, 2026-11-09, board OD2 / R3) the Seattle to San Francisco pack (preset sea_sfo,
# SEA_RUN_ID and SEA_ARTIFACT) goes on the release too, as a data zip and an SD-card zip with the
# game. Workflow artifacts expire after 30 days; a release asset stays, so the release keeps the
# packs. Copernicus DEM and ESA WorldCover may be redistributed with the
# attribution in ATTRIBUTION.txt (DATA.md section 2), which the pack carries. If the artifact is
# gone, the release still publishes and its notes link the 1.0 pack (no SIDs or STARs) with a
# warning; re-run it for the tag with a newer datapack run.

on:
  push:
    tags: ["v*"]
  # Re-run the release for a tag that already exists (for example after a workflow fix): this
  # workflow's steps, the tag's code.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. v1.1.0"
        required: true
      data_run_id:
        description: "datapack workflow run whose pack to attach (empty: the default in this file)"
        required: false
        default: ""
      data_artifact:
        description: "Artifact name in that run (empty: the default in this file)"
        required: false
        default: ""
      sea_run_id:
        description: "datapack run with the sea_sfo pack (empty: the default in this file; 'none' to skip it)"
        required: false
        default: ""
      sea_artifact:
        description: "Artifact name in that run (empty: the default in this file)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read  # download the data pack artifact from the datapack run

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      # The pdx_oth pack for this release: built from main 14c3113 by datapack run 42540892889,
      # with SIDs and STARs (FAA CIFP 2611) and the OpenStreetMap taxiways and aprons (W8a,
      # ODbL). The artifact expires on 2026-12-09. For a later release, run the datapack workflow on
      # main and put its run id and artifact name here.
      DATA_RUN_ID: ${{ inputs.data_run_id || '42540892889' }}
      DATA_ARTIFACT: ${{ inputs.data_artifact || 'flightsim-data-pdx_oth-20261109' }}
      # The sea_sfo pack (Seattle to San Francisco, -124.8,37.0,-120.8,48.2, coarse far view
      # -129,34,-114,51): datapack run 42540895471 on main 14c3113, 1.3 GB, taxiways at 211 of
      # its 267 hard-runway airports. The artifact expires on 2026-12-09.
      SEA_RUN_ID: ${{ inputs.sea_run_id || '42540895471' }}
      SEA_ARTIFACT: ${{ inputs.sea_artifact || 'flightsim-data-sea_sfo-20261109' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Only for a new tag: a manual re-run builds an existing tag's code as it is (v1.1.0 says
      # 0.1.0 there, which is why 1.2 sets the version).
      - name: Check the tag matches the CMake project version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          want="${TAG#v}"
          want="${want%%-*}"
          have="$(grep -oP '^project\(flightsim VERSION \K[0-9.]+' flightsim/CMakeLists.txt)"
          if [ "$want" != "$have" ]; then
            echo "Tag ${TAG} does not match project(flightsim VERSION ${have})." >&2
            echo "Bump the version in flightsim/CMakeLists.txt first." >&2
            exit 1
          fi

      # build_device.sh runs port/check_package.sh inside the Debian 11 image, where the aarch64
      # binutils are, and fails on a bad package. The runner itself has no aarch64 objdump, so
      # a second check here exits 2 (the v1.1.0 run failed that way after a clean build).
      - name: Build and check the device package
        working-directory: flightsim
        env:
          REQUIRE_MAIN: "1"
        run: tools/build_device.sh --docker --skip-probe

      # The data pack goes on the release as pocket-vectors-<tag>-data-pdx_oth.zip with data/ at
      # the top, like the 1.0 pack. It must have the nav database, terrain, ATTRIBUTION.txt, SIDs
      # (a pack built before 1.2's cifp.py has none) and, from 1.3, the taxiways (KPDX rows in
      # nav/taxiways.csv; a pack built before W8a, or when Overpass did not answer, has none).
      - name: Fetch the data pack
        id: pack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/datapack"
          out="${RUNNER_TEMP}/pocket-vectors-${TAG}-data-pdx_oth.zip"
          if ! gh run download "$DATA_RUN_ID" --repo "$GITHUB_REPOSITORY" -n "$DATA_ARTIFACT" -D "$dir"; then
            echo "::warning::Data pack ${DATA_ARTIFACT} (run ${DATA_RUN_ID}) is missing or expired. The notes link the 1.0 pack. Re-run this workflow for ${TAG} with a newer datapack run."
            exit 0
          fi
          if [ ! -f "$dir/data/nav/nav.ini" ] || [ ! -f "$dir/data/terrain/pack.ini" ] || \
             [ ! -f "$dir/data/ATTRIBUTION.txt" ] || ! grep -rqs '^SID ' "$dir/data/nav/procedures" || \
             ! grep -qs '^KPDX,' "$dir/data/nav/taxiways.csv"; then
            echo "::warning::Data pack ${DATA_ARTIFACT} lacks nav, terrain, ATTRIBUTION.txt, SIDs or taxiways (nav/taxiways.csv). The notes link the 1.0 pack."
            exit 0
          fi
          grep -E '^(created_utc|faa_cifp|osm_taxiways) ' "$dir/data/nav/nav.ini" || true
          wc -l "$dir/data/nav/taxiways.csv" "$dir/data/nav/aprons.csv"
          printf '%s\n' "Region pdx_oth: Portland to the coast at North Bend and Mt Hood" \
            "Box -124.7,43.0,-121.4,46.3 (west,south,east,north)" \
            "Main airports: KPDX KHIO KTTD KUAO KSLE KEUG KOTH KAST" > "$dir/data/REGION.txt"
          (cd "$dir" && zip -q -r -X "$out" data)
          ls -l "$out"
          echo "zip=$out" >> "$GITHUB_OUTPUT"

      # The Seattle to San Francisco pack (owner, 2026-11-09): pocket-vectors-<tag>-data-sea_sfo.zip.
      # It holds all of pdx_oth's box, so a player picks one of the two. Same checks, with KSFO
      # taxiways. A missing or expired artifact only skips it (with a warning).
      - name: Fetch the sea_sfo data pack
        id: seapack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$SEA_RUN_ID" = "none" ]; then echo "sea_sfo pack skipped"; exit 0; fi
          dir="${RUNNER_TEMP}/datapack-sea"
          out="${RUNNER_TEMP}/pocket-vectors-${TAG}-data-sea_sfo.zip"
          if ! gh run download "$SEA_RUN_ID" --repo "$GITHUB_REPOSITORY" -n "$SEA_ARTIFACT" -D "$dir"; then
            echo "::warning::sea_sfo pack ${SEA_ARTIFACT} (run ${SEA_RUN_ID}) is missing or expired; the release goes out without it. Re-run this workflow for ${TAG} with a newer sea_sfo datapack run."
            exit 0
          fi
          if [ ! -f "$dir/data/nav/nav.ini" ] || [ ! -f "$dir/data/terrain/pack.ini" ] || \
             [ ! -f "$dir/data/ATTRIBUTION.txt" ] || ! grep -rqs '^SID ' "$dir/data/nav/procedures" || \
             ! grep -qs '^KSFO,' "$dir/data/nav/taxiways.csv"; then
            echo "::warning::sea_sfo pack ${SEA_ARTIFACT} lacks nav, terrain, ATTRIBUTION.txt, SIDs or taxiways; the release goes out without it."
            exit 0
          fi
          grep -E '^(created_utc|faa_cifp|osm_taxiways) ' "$dir/data/nav/nav.ini" || true
          wc -l "$dir/data/nav/taxiways.csv" "$dir/data/nav/aprons.csv"
          printf '%s\n' "Region sea_sfo: Seattle to San Francisco, along the coast and the Cascades" \
            "Box -124.8,37.0,-120.8,48.2 (west,south,east,north); far view -129,34,-114,51" \
            "Main airports: KPAE KBFI KSEA KOLM KPDX KSLE KEUG KOTH KMFR KACV KRDD KSMF KSTS KOAK KSFO KSJC" \
            > "$dir/data/REGION.txt"
          (cd "$dir" && zip -q -r -X "$out" data)
          rm -rf "$dir"
          ls -l "$out"
          echo "zip=$out" >> "$GITHUB_OUTPUT"

      - name: Publish the game zip and the data pack
        working-directory: flightsim
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          PACK_ZIP: ${{ steps.pack.outputs.zip }}
          SEA_ZIP: ${{ steps.seapack.outputs.zip }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          asset="${RUNNER_TEMP}/pocket-vectors-${tag}-game.zip"
          cp dist/flightsim-portmaster.zip "$asset"
          assets=("$asset")
          new_install="Unzip the game zip into \`Roms/PORTS\`. Then add the Pacific Northwest terrain and nav pack:"
          if [ -n "${PACK_ZIP}" ]; then
            # One zip for a new install (from 1.2.2): the game, the pack and the stock OS box art.
            sdzip="${RUNNER_TEMP}/pocket-vectors-${tag}-Roms-PORTS.zip"
            python3 tools/sdcard/make_sdcard_zip.py --game "$asset" --data "$PACK_ZIP" --out "$sdzip"
            ls -l "$sdzip"
            assets+=("$sdzip" "$PACK_ZIP")
            new_install="**Easiest:** download \`$(basename "$sdzip")\` (the game and the pack together) and unzip
          it **into** \`Roms/PORTS\`, so you get \`Roms/PORTS/PocketVectors.sh\` next to \`Roms/PORTS/flightsim/\`.
          If the unzip tool makes a folder named after the zip, move its contents into \`Roms/PORTS\`.

          Or unzip the game zip into \`Roms/PORTS\` and add the Pacific Northwest terrain and nav pack:"
            pack_name="$(basename "$PACK_ZIP")"
            pack_link="[${pack_name}](https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${pack_name}) (on this release, with SIDs, STARs and taxiways)"
            pack_update="For the taxiways (and SIDs and STARs on the flight-plan screen), also download \`${pack_name}\`
          and copy its \`data/nav/\` folder over \`flightsim/data/nav/\` (or the whole \`data/\` folder)."
          else
            pack_link="[pocket-vectors-1.0.0-data-pdx_oth.zip](https://github.com/${GITHUB_REPOSITORY}/releases/download/v1.0.0/pocket-vectors-1.0.0-data-pdx_oth.zip) (the 1.0 pack: no SIDs or STARs)"
            pack_update="The 1.0 data pack keeps working; it has no SIDs or STARs."
          fi
          # The Seattle to San Francisco pack (owner, 2026-11-09): its own data zip and SD-card zip.
          sea_section=""
          if [ -n "${SEA_ZIP}" ]; then
            seasd="${RUNNER_TEMP}/pocket-vectors-${tag}-Roms-PORTS-sea_sfo.zip"
            python3 tools/sdcard/make_sdcard_zip.py --game "$asset" --data "$SEA_ZIP" --out "$seasd"
            ls -l "$seasd"
            assets+=("$seasd" "$SEA_ZIP")
            sea_section="## Seattle to San Francisco

          One pack from Everett and Seattle down the coast and the Cascades to San Francisco and San Jose
          (KPAE, KBFI, KSEA, KPDX, KEUG, KOTH, KSFO, KOAK, KSJC and the fields between), so you can fly
          between them without swapping packs. It covers all of the Pacific Northwest pack too, so use
          one or the other. About 1.3 GB on the card, taxiways at 211 airports.

          - New install: unzip \`$(basename "$seasd")\` **into** \`Roms/PORTS\` (the game and this pack).
          - Existing install: unzip \`$(basename "$SEA_ZIP")\` and copy its \`data/\` folder over
            \`Roms/PORTS/flightsim/data/\` (it replaces the Pacific Northwest pack), or keep it in
            another folder and set \`data_dir\` in \`flightsim/conf/settings.ini\`."
          fi
          notes="${RUNNER_TEMP}/notes.md"
          cat > "$notes" <<EOF
          Pocket Vectors ${tag} for the Anbernic RG40XXH (stock OS, 64-bit, SDL2).

          The game zip is the game only: \`PocketVectors.sh\` and \`flightsim/\`, with no probe and no terrain pack.

          ## Update an existing install

          Unzip \`pocket-vectors-${tag}-game.zip\` into \`Roms/PORTS\` and **merge** the folders, so
          \`flightsim/conf/\` and \`flightsim/data/\` stay. In the macOS Finder, "Replace" deletes
          \`flightsim/data/\`: merge instead, or copy \`data/\` back afterwards. If you created
          \`flightsim/conf/controls.ini\` for the 1.0 A/B workaround, delete it. From 1.2.2 the launch
          script is \`PocketVectors.sh\` (the Ports menu shows its name, with box art on the stock OS):
          delete the old \`FlightSim.sh\` from \`Roms/PORTS\`, or the game is listed twice.
          ${pack_update}

          ## New install

          ${new_install}
          unzip ${pack_link}
          and copy the \`data/\` folder inside it to \`Roms/PORTS/flightsim/\`. Or combine both into one zip
          with \`flightsim/tools/sdcard/make_sdcard_zip.py\` (see flightsim/INSTALL.md).

          ${sea_section}

          ## Other regions

          Build a pack from the Actions tab (workflow \`datapack\`, presets \`pdx_oth\`, \`sea_sfo\`,
          \`bayarea\`, \`mthood\`, \`tam_diablo\`, or a \`bbox\`) or with \`tools/datapack/build_datapack.sh\`.
          Keep the pack's \`ATTRIBUTION.txt\`.

          Code: Apache-2.0. JSBSim is LGPL-2.1. Taxiway data © OpenStreetMap contributors: the pack's
          \`nav/taxiways.csv\` and \`nav/aprons.csv\` are shared under the ODbL (\`nav/TAXIWAYS-ODbL.txt\`).
          Zack Martin, https://github.com/zackm-780.
          EOF
          # The heredoc above is indented; strip the leading spaces.
          sed -i 's/^          //' "$notes"
          # Append this version's CHANGELOG section (the lines under "## <version>").
          ver="${tag#v}"
          ver="${ver%%-*}"
          if [ -f ../CHANGELOG.md ]; then
            changes="$(awk -v v="## ${ver}" '$0 == v || index($0, v " ") == 1 {on = 1; next} /^## / {on = 0} on' ../CHANGELOG.md)"
            if [ -n "$changes" ]; then
              printf '\n## Changes\n%s\n' "$changes" >> "$notes"
            fi
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            # The release was published from the web page (which also creates the tag).
            gh release upload "$tag" "${assets[@]}" --clobber
            if [ -z "$(gh release view "$tag" --json body --jq .body)" ]; then
              gh release edit "$tag" --notes-file "$notes"
            fi
          else
            gh release create "$tag" "${assets[@]}" --title "Pocket Vectors ${tag}" --notes-file "$notes"
          fi
