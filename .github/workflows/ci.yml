name: CI

on:
  push:
    branches: [main, "wp/**"]
  pull_request:

jobs:
  desktop:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: flightsim
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git libsdl2-dev xvfb mesa-utils \
            libgl1-mesa-dri libegl1 libgles2

      # JSBSim is fetched and built by CMake (several minutes); keep its sources and objects.
      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: flightsim/build
          key: build-${{ runner.os }}-${{ hashFiles('flightsim/CMakeLists.txt', 'flightsim/cmake/**') }}
          restore-keys: build-${{ runner.os }}-

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFSIM_WERROR=ON

      - name: Build
        run: cmake --build build

      - name: Format check
        run: |
          sudo apt-get install -y --no-install-recommends clang-format
          find src tests -name '*.h' -o -name '*.cpp' | xargs clang-format --dry-run --Werror

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Headless scenarios
        run: |
          mkdir -p out
          ./build/flightsim --headless --scenario assets/scenarios/c172_runway_xtst.ini --duration 40 --trace out/c172_runway_trace.csv
          ./build/flightsim --headless --scenario assets/scenarios/c172_final_xtst.ini --duration 120 --trace out/c172_final_trace.csv
          ./build/flightsim --headless --scenario assets/scenarios/737_final_xtst.ini --duration 60 --trace out/737_final_trace.csv

      - name: Screenshots under Xvfb (Mesa software GL)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x960x24" ./build/flightsim --scenario assets/scenarios/c172_runway_xtst.ini --frames 120 --screenshot out/runway_cockpit.png
          xvfb-run -a -s "-screen 0 1280x960x24" ./build/flightsim --scenario assets/scenarios/c172_short_final_xtst.ini --frames 60 --screenshot out/short_final.png

      - name: Upload traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flightsim-ci-output
          path: flightsim/out/
          if-no-files-found: warn
