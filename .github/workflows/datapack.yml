name: datapack

# Builds the flightsim data pack (terrain + nav + FAA approaches, optional world coarse layer) from
# public sources and uploads it as one artifact holding a data/ folder. Run it from the Actions tab
# ("Run workflow"), download the artifact, unzip it once and copy data/ into Roms/PORTS/flightsim/
# on the SD card. The data is never committed.
# See flightsim/tools/datapack/README.md.

on:
  workflow_dispatch:
    inputs:
      preset:
        description: "Region preset for terrain levels 7-10 (see build_terrain.py --list-presets)"
        type: string
        default: pdx_oth
      include_world:
        description: "Also build the world coarse layer, levels 0-6 (about 50 GB of downloads, hours, ~3 GB pack)"
        type: boolean
        default: false
      bbox:
        description: "Optional west,south,east,north box instead of the preset (example -123.4,43.1,-123.0,43.4)"
        type: string
        default: ""

jobs:
  datapack:
    runs-on: ubuntu-latest
    timeout-minutes: 345   # GitHub's hard limit is 360
    env:
      PRESET: ${{ inputs.preset }}
      INCLUDE_WORLD: ${{ inputs.include_world }}
      BBOX: ${{ inputs.bbox }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # terrain/requirements.txt pins numpy==2.5.4, which needs Python >= 3.12.
          python-version: "3.12"

      - name: Free disk space (the world layer downloads about 50 GB)
        if: ${{ inputs.include_world }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / /mnt | tail -n 2

      # Nav cycle id (changes every 28 days), used in the cache key.
      - name: Cache keys
        id: keys
        run: |
          echo "cycle=$(date -u +%Y-%m)-$(( $(date -u +%s) / 86400 / 28 ))" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          if [ -n "$BBOX" ]; then
            echo "region=bbox-$(printf '%s' "$BBOX" | tr ', ' '__')" >> "$GITHUB_OUTPUT"
          else
            echo "region=$PRESET" >> "$GITHUB_OUTPUT"
          fi

      # Region sources (GLO-30 + WorldCover) are the same for a preset across cycles; the world
      # layer cache (GLO-90, ~50 GB) is deliberately NOT cached (10 GB repository cache limit).
      - name: Cache terrain downloads
        uses: actions/cache@v4
        with:
          path: flightsim/tools/terrain/cache
          key: terrain-${{ steps.keys.outputs.region }}-v1
      - name: Cache nav downloads
        uses: actions/cache@v4
        with:
          path: flightsim/tools/nav/cache
          key: nav-${{ steps.keys.outputs.region }}-${{ steps.keys.outputs.cycle }}
          restore-keys: nav-${{ steps.keys.outputs.region }}-

      - name: Shell syntax and lint
        run: |
          bash -n flightsim/tools/datapack/build_datapack.sh
          shellcheck -S warning flightsim/tools/datapack/build_datapack.sh

      - name: Build the data pack
        working-directory: flightsim
        run: |
          set -euo pipefail
          args=(--out "$RUNNER_TEMP/upload/data" --jobs "$(nproc)")
          if [ -n "$BBOX" ]; then args+=(--bbox "$BBOX"); else args+=(--preset "$PRESET"); fi
          if [ "$INCLUDE_WORLD" = "true" ]; then args+=(--world); fi
          # world cache on the big temp disk when the workspace disk is small
          sudo mkdir -p /mnt/world-cache && sudo chown "$USER" /mnt/world-cache
          args+=(--world-cache /mnt/world-cache)
          # pipefail: without it, a failing build still looks green when tee|tail both succeed.
          tools/datapack/build_datapack.sh "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/build.log" | tail -n 400

      # The artifact holds data/ itself (not a zip inside the artifact's zip): one unzip, then copy.
      # upload-artifact deflates it; terrain tiles shrink to about 20-50 percent, CSVs to about 25.
      - uses: actions/upload-artifact@v4
        with:
          name: flightsim-data-${{ steps.keys.outputs.region }}-${{ steps.keys.outputs.date }}
          path: ${{ runner.temp }}/upload/
          retention-days: 30
          compression-level: 6
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          {
            echo "## Data pack"
            echo "Preset \`$PRESET\`, bbox \`${BBOX:-none}\`, world layer: \`$INCLUDE_WORLD\`."
            echo "Download the artifact, unzip it once and copy its \`data\` folder into \`Roms/PORTS/flightsim/\` on the SD card."
            echo '```'
            tail -n 25 "$RUNNER_TEMP/build.log" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
