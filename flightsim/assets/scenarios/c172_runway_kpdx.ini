; Cessna 172P on runway 28L of Portland International (KPDX), parking brake set, engine running.
; Needs the nav pack in <data root>/nav (N1/N2); without it the airport is not found and the run
; fails with a readable error. Until terrain contact lands (F3) the ground is flat at field
; elevation. Scripted takeoff like c172_runway_xtst.ini (brake off, full throttle, small rudder).
[scenario]
aircraft = c172p
airport = KPDX
runway = 28L
start = runway
time_utc = 2026-06-21T18:00:00

[wind]
from_true_deg = 300
speed_kt = 0

[inputs]
0.0  = parkingbrake 0
0.0  = throttle 1.0
0.0  = rudder 0.03
15.0 = aileron 0.10
