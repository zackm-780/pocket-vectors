; WP F4 autopilot check: Cessna 182S on a 10 NM final to XTST 27 with a 10 kt crosswind. The AP
; descends in VS mode on heading 290; arm APR (LOC + G/S) by hand after about 30 s with the
; heading bug on 250 (tests/fleet/FleetApTest.cpp does this) and the AP flies the synthesized
; ILS I27 down to the minimums disconnect.
[scenario]
aircraft = c182
airport = XTST
runway = 27
start = final
distance_nm = 10
approach = I27
time_utc = 2026-06-21T18:00:00

[wind]
from_true_deg = 360
speed_kt = 10

[autopilot]
engage = ap at hdg vs
hdg_bug_mag_deg = 290
alt_bug_ft = 4800
vs_bug_fpm = -1000
spd_bug_kt = 70
