; F10: a touch-and-go with the speed brakes armed: as 737_land_armed_xtst.ini, then full thrust
; 2 s after touchdown (about 54.6 s): the speed brakes stow at once (SPEEDBRAKE STOWED) and it climbs.
; Headless check: flightsim --headless --scenario assets/scenarios/737_goaround_armed_xtst.ini
;   --duration 100 --trace /tmp/ga.csv
[scenario]
aircraft = 737
airport = XTST
runway = 27
start = final
distance_nm = 2.5
time_utc = 2026-06-21T18:00:00

[wind]
from_true_deg = 270
speed_kt = 0

[autopilot]
engage = ap apr

[inputs]
0 = speedbrake_arm 1
52 = throttle 0
57 = throttle 1
