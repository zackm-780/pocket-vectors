; F10: a 737 on a 2.5 NM final at XTST with the speed brakes armed: the AP flies the ILS, the
; throttles go to idle near the runway, and the speed brakes deploy at touchdown (SPDBRK 100%).
; Headless check: flightsim --headless --scenario assets/scenarios/737_land_armed_xtst.ini
;   --duration 90 --trace /tmp/land.csv (the trace's speedbrake column goes to 1 at touchdown).
[scenario]
aircraft = 737
airport = XTST
runway = 27
start = final
distance_nm = 2.5
time_utc = 2026-06-21T18:00:00

[wind]
from_true_deg = 270
speed_kt = 0

[autopilot]
engage = ap apr

[inputs]
0 = speedbrake_arm 1
52 = throttle 0
58 = brakes 1
