; McDonnell Douglas MD-11 (JSBSim stock model "MD11", three CF6-80C2, about 398,000 lb with the shipped
; 19,700 lb of fuel).
; Format reference: src/sim/README.md. Comments are whole lines only (no inline comments).
;
; Sources and method (WP F4):
; Vmo 365 kt / Mmo 0.87 and the flap placard speeds are commonly published MD-11 limits (public
; summaries, no AFM in the repo): ESTIMATES. The model has one flap channel, 0..30 degrees, so the
; detents are UP, 15 and 30 (the real airplane also has 25 and 35). Each command is degrees / 30.
; Stall speeds, rotation and approach speeds are MEASURED on the model with tests/fleet (idle
; deceleration at 1 g, see tests/fleet/README.md). The model is not tuned toward the real airplane.
[aircraft]
id = MD11
display_name = McDonnell Douglas MD-11
jsbsim_model = MD11
category = jet
engines = 3
retractable_gear = true
speedbrake = true
reversers = true
autothrottle = true

[flaps]
detents = UP:0.0, 15:0.5, 30:1.0
vfe_kt = 0, 230, 190
takeoff_detent = 1
approach_detent = 2

[speeds_kt]
vs0 = 109
vs1 = 163
vr = 150
vref = 130
vapp = 135
vfe = 250
vmo = 365
mmo = 0.87

[cruise]
ias_kt = 270
altitude_ft = 33000

[warnings]
stall_warn_alpha_deg = 10

[crash]
hard_landing_fpm = 1100
touchdown_bank_deg = 10
touchdown_pitch_up_deg = 10
touchdown_pitch_down_deg = 8

[ground]
steer_full_below_kt = 15
steer_min_above_kt = 80
steer_min_frac = 0.1

[autopilot]
bank_limit_deg = 25
heading_tau_s = 5
nav_tau_s = 30
bank_rate_limit_degps = 3
pitch_rate_limit_degps = 1.5
vs_default_fpm = 1500
vs_max_climb_fpm = 3000
vs_max_descent_fpm = 3000
