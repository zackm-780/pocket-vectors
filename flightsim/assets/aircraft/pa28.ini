; Piper PA-28 Cherokee (JSBSim stock model "pa28", IO-360 180 hp, fixed tricycle gear, about 1,950 lb).
; Format reference: src/sim/README.md. Comments are whole lines only (no inline comments).
;
; Sources and method (WP F4):
; Vne 154 kt, Vno 125 kt, Vfe 103 kt and the stall figures 55 / 50 kt are the commonly published
; PA-28-181 numbers from public POH summaries (no POH in the repo): ESTIMATES. The model's flaps
; run 0, 15, 25, 40 degrees; the real airplane's 10 / 25 / 40 detents are used with a command of
; degrees / 40 (the kinematic scales linearly between the model's breakpoints).
; Rotation and approach speeds are MEASURED on the model with tests/fleet.
; Overlay: the stock propeller (engine/propC8v.xml) cannot be trimmed at the cruise and final speeds and is
; replaced by the c172p fixed-pitch propeller, see assets/jsbsim-overlay/engine and tests/fleet/README.md.
; F8 overlay (assets/jsbsim-overlay/aircraft/pa28/pa28.xml): the flap pitching moment is 0.3 x stock and the
; 25 degree flap lift is fixed, so full flaps climb at full power (+128 fpm at 75 kt, the balked-landing rule).
[aircraft]
id = pa28
display_name = Piper PA-28 Cherokee
jsbsim_model = pa28
category = piston
engines = 1
retractable_gear = false
speedbrake = false
reversers = false
autothrottle = false

[flaps]
detents = UP:0.0, 10:0.25, 25:0.625, 40:1.0
vfe_kt = 0, 103, 103, 103
takeoff_detent = 0
approach_detent = 3

[speeds_kt]
; H9: the weight these speeds were measured at: the stock model's shipped weight with its default
; fuel, MEASURED by tests/fleet (profile phase, FLEET pa28 weight_lbs). The speed bugs scale
; with sqrt(weight / this).
ref_weight_lbs = 1980
; Rotation, liftoff and approach are measured. Stall: the model is limited by elevator authority and never
; reaches a real stall: clean 61 kt at alpha 7.9, flaps 40 at idle 60.5 kt at alpha 5.6 with the F8 overlay
; (68 kt at alpha 3.7 before it: the flaps pitched the nose down beyond the elevator). Vs0 54 and Vs1 61 are
; therefore a rounded published figure and the clean measurement; the test rules Vr > 1.1 x Vs0 and
; Vapp > 1.15 x the approach stall (the 68 kt then) set Vr 60 and Vapp 80, kept.
vs0 = 54
vs1 = 61
vr = 60
vref = 75
vapp = 80
vfe = 103
vno = 125
vne = 154

[cruise]
ias_kt = 100
altitude_ft = 5500
; F6: measured fuel flow at this cruise (JSBSim, AP + A/T level, 30 s), all engines.
fuel_flow_lbs_hr = 84

[warnings]
; Set below the 7.9 degrees at which the clean model runs out of elevator.
stall_warn_alpha_deg = 7

[properties]
structure_contacts = TAIL_SKID, VTAIL_TOP, VTAIL_TIP, LEFT_TIP, RIGHT_TIP, NOSE_TIP

[crash]
hard_landing_fpm = 900
touchdown_bank_deg = 25
touchdown_pitch_up_deg = 20
touchdown_pitch_down_deg = 15

[ground]
steer_full_below_kt = 15
steer_min_above_kt = 60
steer_min_frac = 0.15

[autopilot]
at_available = 1
bank_limit_deg = 20
heading_tau_s = 3.5
nav_tau_s = 20
pitch_kp = 0.08
pitch_kd = 0.06
vs_default_fpm = 500
vs_max_climb_fpm = 1000
vs_max_descent_fpm = 1200
min_climb_ias_kt = 65

[view]
; V1 external view: model built in code and its wingspan (JSBSim metrics).
external_model = single
wingspan_m = 9.14
; Measured: the JSBSim reference point's height above the runway on the wheels.
gear_height_m = 1.07

[controls]
; F9 (tests/fleet/FleetHandlingTest.cpp): the left stick's Y expo (the [axes] default), and a
; larger trim step and rate than the default: the stock pa28's trim is weak (a default tap moved
; the VS by 20 fpm). A tap now moves it by 30-150 fpm, one second of trim by 150-600.
pitch_expo = 0.6
trim_step_norm = 0.009
trim_rate_norm_per_s = 0.08
