; Bombardier Global 5000 (JSBSim stock model "global5000", about 80,000 lb loaded).
; Format reference: src/sim/README.md. Comments are whole lines only (no inline comments).
;
; Sources and method (WP F2):
; Geometry, weights and thrust come from the model (based on AIAA 2016-3525, cited in its header).
; Flap settings 0/6/16/20/30 and Vmo 340 kt / Mmo 0.89 are the commonly published Global
; Express/5000 figures. Per-detent Vfe values are estimates in the usual business-jet range; there
; is no primary AFM in the repo.
; Stall speeds, stall angles of attack, rotation and approach speeds are MEASURED on the model with
; tests/fleet (idle deceleration at 1 g, see tests/fleet/README.md).
[aircraft]
id = global5000
display_name = Bombardier Global 5000
jsbsim_model = global5000
category = jet
engines = 2
retractable_gear = true
speedbrake = true
reversers = true
autothrottle = true

[flaps]
; fcs/flap-cmd-norm is scaled by the model's 30 degree flap travel: detent = degrees / 30.
detents = UP:0.0, 6:0.2, 16:0.5333, 20:0.6667, 30:1.0
vfe_kt = 0, 250, 230, 215, 190
; Flaps 16 for takeoff, flaps 30 for the approach.
takeoff_detent = 2
approach_detent = 4

[speeds_kt]
; Measured: Vs1 = clean (150), Vs0 = flaps 30 (96), flaps 16 stall 113.
vs0 = 96
vs1 = 150
; Rotation starts here (flaps 16); liftoff follows at about 131 kt.
vr = 125
; Vapp = 1.35 x the flaps 30 stall speed, Vref = Vapp - 5.
vref = 125
vapp = 130
vfe = 250
vmo = 340
mmo = 0.89

[cruise]
ias_kt = 260
altitude_ft = 37000

[warnings]
; Measured stall angle of attack: 14.0 flaps 30, 14.3 flaps 20, 14.4 flaps 16, 17.5 flaps 6.
stall_warn_alpha_deg = 12

[crash]
hard_landing_fpm = 1100
touchdown_bank_deg = 12
touchdown_pitch_up_deg = 12
touchdown_pitch_down_deg = 8

[ground]
steer_full_below_kt = 15
steer_min_above_kt = 80
steer_min_frac = 0.1
