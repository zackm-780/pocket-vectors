; Cessna 172P Skyhawk (JSBSim stock model "c172p").
; Format reference: src/sim/README.md. Comments are whole lines only (no inline comments).
[aircraft]
id = c172p
display_name = Cessna 172P Skyhawk
jsbsim_model = c172p
category = piston
engines = 1
retractable_gear = false
speedbrake = false
reversers = false
autothrottle = false

[flaps]
; label:command (fcs/flap-cmd-norm). The c172p flap travel is 0, 10, 20, 30 degrees.
detents = UP:0.0, 10:0.3333, 20:0.6667, 30:1.0
; Max speed with each detent selected (kt IAS): 110 with flaps 10, 85 beyond.
vfe_kt = 0, 110, 85, 85
; Indices into the detent list: flaps UP for takeoff, flaps 20 for the approach.
takeoff_detent = 0
approach_detent = 2

[speeds_kt]
; H9: the weight these speeds were measured at: the stock model's shipped weight with its default
; fuel, MEASURED by tests/fleet (profile phase, FLEET c172p weight_lbs). The speed bugs scale
; with sqrt(weight / this).
ref_weight_lbs = 1880
vs0 = 33
vs1 = 44
vr = 55
vref = 65
vapp = 65
vfe = 85
vno = 129
vne = 163

[cruise]
ias_kt = 105
altitude_ft = 5500
; F6: measured fuel flow at this cruise (JSBSim, AP + A/T level, 30 s), all engines.
fuel_flow_lbs_hr = 53

[warnings]
stall_warn_alpha_deg = 11

[view]
; V1 external view: model built in code and its wingspan (JSBSim metrics).
external_model = single
wingspan_m = 10.9
; Measured: the JSBSim reference point's height above the runway on the wheels.
gear_height_m = 1.34
; Used only when the model has no EYEPOINT (the stock c172p has one).
eye_offset_m = 0.13, 0.0, -0.26

[crash]
hard_landing_fpm = 900
touchdown_bank_deg = 25
touchdown_pitch_up_deg = 20
touchdown_pitch_down_deg = 15

[ground]
steer_full_below_kt = 15
steer_min_above_kt = 60
steer_min_frac = 0.15
; F11: below tiller_below_kt (35) the nose wheel follows the stick in degrees: up to
; tiller_max_deg (pedal steering plus differential braking), and never more than gives steer_lat_g (0.3 g) at the ground speed, rate
; limited to steer_rate_deg_s. wheelbase_ft is from the model's NOSE and MAIN contact x
; (-6.8 and 58.2 in).
tiller_max_deg = 30
wheelbase_ft = 5.42
steer_rate_deg_s = 40

[autopilot]
; Speed hold on request (L1 + B) although the aircraft has no autothrottle of its own.
at_available = 1
; WP N6 gains and limits (src/autopilot/README.md lists every key; omitted keys use
; category defaults).
bank_limit_deg = 20
heading_tau_s = 3.5
nav_tau_s = 20
pitch_kp = 0.08
pitch_kd = 0.06
vs_default_fpm = 500
vs_max_climb_fpm = 1000
vs_max_descent_fpm = 1200
min_climb_ias_kt = 60

[controls]
; F9: the left stick's Y expo for this aircraft (tests/fleet/FleetHandlingTest.cpp): raw 0.2 held
; 3 s changes the VS by 150-500 fpm in cruise.
pitch_expo = 0.83
; One trim press (elevator trim, -1..1) and the rate held past 0.3 s, both shrinking with
; (Vref / IAS)^2 above Vref: a tap moves the VS by 30-150 fpm, one second of trim 150-600.
trim_step_norm = 0.005
