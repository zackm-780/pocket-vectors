; Cessna 310 (JSBSim stock model "c310", a 310R-class light twin with two IO-470, about 4,400 lb).
; Format reference: src/sim/README.md. Comments are whole lines only (no inline comments).
;
; Sources and method (WP F2):
; Rotation 80, Vx 81, Vy 107, Vmca 75, stall 75/70/63 (flaps 0/15/35), Vno 183, Vne 223, Vle/Vlo
; 139 and the landing speed 90 come from aircraft/c310/README.c310 in the JSBSim tree (figures for
; the type collected from a public web page, not an AFM). Per-detent flap speeds are estimates.
; Measured on the model with tests/fleet: stall 74.6 clean, 68.1 flaps 15, 59.0 flaps 45 (the
; README numbers are reproduced to within a few knots).
; The stock c310 has a constant-speed propeller that cannot be trimmed (blade pitch resets to
; fine pitch at every initial condition, and fcs/advance-cmd-norm is never set). The overlay in
; assets/jsbsim-overlay uses a fixed-pitch propeller instead.
[aircraft]
id = c310
display_name = Cessna 310
jsbsim_model = c310
category = piston
engines = 2
retractable_gear = true
speedbrake = false
reversers = false
autothrottle = false

[flaps]
; label:command. fcs/flap-cmd-norm is scaled by the model's 45 degree flap travel (kinematic
; breakpoints at 0, 15, 25 and 45 degrees), so each detent is degrees / 45.
detents = UP:0.0, 15:0.3333, 25:0.5556, 45:1.0
vfe_kt = 0, 140, 125, 110
; Flaps UP for takeoff, flaps 15 for the approach.
takeoff_detent = 0
approach_detent = 1

[speeds_kt]
vs0 = 63
vs1 = 75
vr = 80
; README landing speed 90, Vapp = 1.4 x the flaps 15 stall speed.
vref = 90
vapp = 95
vfe = 140
vno = 183
vne = 223

[cruise]
; Econo cruise of the README: 144 kt true at 7,500 ft is about 125 kt indicated.
ias_kt = 125
altitude_ft = 7500

[warnings]
; Measured stall angle of attack is 15.0 to 15.5 in every configuration.
stall_warn_alpha_deg = 12.5

[crash]
hard_landing_fpm = 900
touchdown_bank_deg = 25
touchdown_pitch_up_deg = 20
touchdown_pitch_down_deg = 15

[ground]
steer_full_below_kt = 15
steer_min_above_kt = 60
steer_min_frac = 0.2
