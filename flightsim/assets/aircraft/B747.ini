; Boeing 747-400 (JSBSim stock model "B747", four CF6-80C2, about 551,000 lb loaded).
; Format reference: src/sim/README.md. Comments are whole lines only (no inline comments).
;
; Sources and method (WP F2):
; Flap placard speeds (flaps 1/5/10/20/25/30 = 280/260/240/230/205/180 kt) are the commonly
; published 747-400 flap limit speeds. Vmo 365 kt / Mmo 0.92 are the 747-400 limits. These are
; public figures from memory and reference sites; there is no primary AFM in the repo.
; The JSBSim model has 0..30 degrees of flap, so flaps 30 is the landing setting.
; Stall speeds, stall angles of attack, rotation and approach speeds are MEASURED on the model with
; tests/fleet (idle deceleration at 1 g, see tests/fleet/README.md). The model cannot be trimmed
; above about 150 kt with flaps 30.
[aircraft]
id = B747
display_name = Boeing 747-400
jsbsim_model = B747
category = jet
engines = 4
retractable_gear = true
speedbrake = true
reversers = true
autothrottle = true

[flaps]
; label:command. fcs/flap-cmd-norm is scaled by the model's 30 degree flap travel: degrees / 30.
detents = UP:0.0, 1:0.0333, 5:0.1667, 10:0.3333, 20:0.6667, 25:0.8333, 30:1.0
vfe_kt = 0, 280, 260, 240, 230, 205, 180
; Flaps 20 for takeoff (the model rotates and climbs well there), flaps 30 for the approach.
takeoff_detent = 4
approach_detent = 6

[speeds_kt]
; Measured: Vs1 = clean (156), Vs0 = flaps 30 (113), flaps 20 stall 120.
vs0 = 113
vs1 = 156
; Rotation starts here (flaps 20); liftoff follows at about 150 kt.
vr = 140
; Vapp = 1.25 x the flaps 30 stall speed, Vref = Vapp - 5.
vref = 135
vapp = 140
vfe = 280
vmo = 365
mmo = 0.92

[cruise]
ias_kt = 280
altitude_ft = 35000

[warnings]
; Measured stall angle of attack falls with flap: 18.1 clean, 14.9 flaps 5, 10.8 flaps 20, 9.2 flaps
; 25, 7.7 flaps 30. One value serves all: it is just below the flaps 30 stall and above the
; 6.5 degrees of angle of attack at liftoff with flaps 20.
stall_warn_alpha_deg = 7.0

[crash]
hard_landing_fpm = 1100
touchdown_bank_deg = 10
touchdown_pitch_up_deg = 10
touchdown_pitch_down_deg = 8

[ground]
steer_full_below_kt = 15
steer_min_above_kt = 80
steer_min_frac = 0.1

[autopilot]
; WP N6 gains and limits (src/autopilot/README.md lists every key; omitted keys use
; category defaults).
bank_limit_deg = 25
heading_tau_s = 5
nav_tau_s = 30
bank_rate_limit_degps = 3
pitch_rate_limit_degps = 1.5
pitch_kp = 0.06
pitch_kd = 0.05
vs_default_fpm = 1500
vs_max_climb_fpm = 3000
vs_max_descent_fpm = 3000
