; Boeing 747-400 (JSBSim stock model "B747").
; Format reference: src/sim/README.md. Comments are whole lines only (no inline comments).
[aircraft]
id = B747
display_name = Boeing 747-400
jsbsim_model = B747
category = jet
engines = 4
retractable_gear = true
speedbrake = true
reversers = true
autothrottle = true

[flaps]
; fcs/flap-cmd-norm is scaled by the model's 30 degree flap travel: detent = degrees / 30.
detents = UP:0.0, 1:0.0333, 5:0.1667, 10:0.3333, 20:0.6667, 25:0.8333, 30:1.0
vfe_kt = 0, 280, 260, 240, 230, 205, 180
takeoff_detent = 2
approach_detent = 6

[speeds_kt]
vs0 = 120
vs1 = 135
vr = 160
vref = 150
vapp = 155
vfe = 180
vmo = 365
mmo = 0.92

[cruise]
ias_kt = 280
altitude_ft = 35000

[warnings]
stall_warn_alpha_deg = 10

[crash]
hard_landing_fpm = 1100
touchdown_bank_deg = 10
touchdown_pitch_up_deg = 10
touchdown_pitch_down_deg = 8

[ground]
steer_full_below_kt = 15
steer_min_above_kt = 80
steer_min_frac = 0.1
