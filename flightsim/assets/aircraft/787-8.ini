; Boeing 787-8 (JSBSim stock model "787-8", from the FlightGear FGAddon aircraft; about 371,000 lb with
; the shipped 66,000 lb of fuel).
; Format reference: src/sim/README.md. Comments are whole lines only (no inline comments).
;
; Sources and method (WP F4):
; Vmo 330 kt / Mmo 0.90 and the flap placard speeds are commonly published 787 limits (public
; summaries, no FCOM in the repo): ESTIMATES. The model has one flap channel, 0..35 degrees in 30 s;
; each detent command is degrees / 35 (1, 5, 15, 20, 25, 30 as on the real airplane).
; Stall speeds, rotation and approach speeds are MEASURED on the model with tests/fleet (idle
; deceleration at 1 g, see tests/fleet/README.md). The model is not tuned toward the real airplane.
[aircraft]
id = 787-8
display_name = Boeing 787-8 Dreamliner
jsbsim_model = 787-8
category = jet
engines = 2
retractable_gear = true
speedbrake = true
reversers = true
autothrottle = true

[flaps]
detents = UP:0.0, 1:0.0286, 5:0.1429, 15:0.4286, 20:0.5714, 25:0.7143, 30:0.8571, 35:1.0
vfe_kt = 0, 255, 235, 215, 200, 190, 180, 170
takeoff_detent = 3
approach_detent = 6

[speeds_kt]
vs0 = 136
vs1 = 179
vr = 155
vref = 160
vapp = 165
vfe = 255
vmo = 330
mmo = 0.90

[cruise]
ias_kt = 250
altitude_ft = 37000

[warnings]
stall_warn_alpha_deg = 11

[crash]
hard_landing_fpm = 1100
touchdown_bank_deg = 10
touchdown_pitch_up_deg = 10
touchdown_pitch_down_deg = 8

[ground]
steer_full_below_kt = 15
steer_min_above_kt = 80
steer_min_frac = 0.1

[autopilot]
bank_limit_deg = 25
heading_tau_s = 5
nav_tau_s = 30
bank_rate_limit_degps = 3
pitch_rate_limit_degps = 1.5
vs_default_fpm = 1500
vs_max_climb_fpm = 3000
vs_max_descent_fpm = 3000
