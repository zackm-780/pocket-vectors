; PLACEHOLDER aircraft profile (WP-00): best effort so jet paths are exercised by the bootstrap.
; WP F2 replaces this with the complete, validated profile.
[aircraft]
id = 737
display_name = Boeing 737
jsbsim_model = 737
category = jet
engines = 2
retractable_gear = true
speedbrake = true
reversers = true
autothrottle = true

[flaps]
; JSBSim 737 flap command is normalized 0..1 over 0..40 degrees.
detents = UP:0.0, 1:0.025, 5:0.125, 10:0.25, 15:0.375, 25:0.625, 30:0.75, 40:1.0
takeoff_detent = 2
approach_detent = 6

[speeds_kt]
vs0 = 105
vs1 = 130
vr = 140
vref = 140
vapp = 145
vfe = 190
vmo = 340
mmo = 0.82

[cruise]
ias_kt = 280
altitude_ft = 35000

[warnings]
stall_warn_alpha_deg = 12
