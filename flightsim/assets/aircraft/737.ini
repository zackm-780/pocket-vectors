; Boeing 737 (JSBSim stock model "737", a 737-200 class airframe, about 107,000 lb loaded).
; Format reference: src/sim/README.md. Comments are whole lines only (no inline comments).
;
; Sources and method (WP F2):
; Flap placard speeds: public 737 Classic (-300/-400) limitation figures, applied to this -200
; class model as an approximation. There is no primary AFM in the repo.
; Vmo 340 kt / Mmo 0.82: typical 737 Classic limits, rounded.
; Stall speeds, stall angles of attack, rotation and approach speeds are MEASURED on the model with
; tests/fleet (idle deceleration at 1 g, see tests/fleet/README.md) because the JSBSim 737 stalls
; well above a real 737 at this weight. The model is not tuned toward the real airplane.
[aircraft]
id = 737
display_name = Boeing 737
jsbsim_model = 737
category = jet
engines = 2
retractable_gear = true
speedbrake = true
reversers = true
autothrottle = true

[flaps]
; label:command. fcs/flap-cmd-norm is normalized over 0..40 degrees of flap travel (the model's
; Flaps Control kinematic moves 0..1 in eighths), so each detent is degrees / 40.
detents = UP:0.0, 1:0.025, 2:0.05, 5:0.125, 10:0.25, 15:0.375, 25:0.625, 30:0.75, 40:1.0
; Max speed with each detent selected (kt IAS), in detent order.
vfe_kt = 0, 230, 230, 225, 210, 195, 190, 185, 158
; Indices into the detent list: flaps 5 for takeoff, flaps 30 for the approach.
takeoff_detent = 3
approach_detent = 7

[speeds_kt]
; Measured: Vs1 = clean (152), Vs0 = flaps 40 (118), flaps 30 stall 124.
vs0 = 118
vs1 = 152
; Rotation starts here (flaps 5); liftoff follows at about 151 kt.
vr = 145
; Vapp = 1.17 x the measured flaps 30 stall speed (the model still has 6 degrees of angle of attack
; margin there), Vref = Vapp - 5.
vref = 140
vapp = 145
vfe = 230
vmo = 340
mmo = 0.82

[cruise]
ias_kt = 270
altitude_ft = 33000

[warnings]
; Measured stall angle of attack: 14.6 clean, 14.3 flaps 5, 12.9 flaps 15, 11.8 flaps 30, 11.2 flaps 40.
stall_warn_alpha_deg = 10.5

[properties]
; Ground spoilers: out on the ground when the speedbrake is out or reverse is selected.
spoiler_cmd = fcs/spoiler-cmd-norm

[crash]
hard_landing_fpm = 1100
touchdown_bank_deg = 12
touchdown_pitch_up_deg = 12
touchdown_pitch_down_deg = 8

[ground]
steer_full_below_kt = 15
steer_min_above_kt = 80
steer_min_frac = 0.1

[autopilot]
; WP N6 gains and limits (src/autopilot/README.md lists every key; omitted keys use
; category defaults).
bank_limit_deg = 25
heading_tau_s = 4.5
nav_tau_s = 25
pitch_kp = 0.06
pitch_kd = 0.05
vs_default_fpm = 1500
vs_max_climb_fpm = 3000
vs_max_descent_fpm = 3000
