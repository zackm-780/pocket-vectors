; Airbus A320-200 (JSBSim stock model "A320", about 141,000 lb with the shipped 30,000 lb of fuel).
; Format reference: src/sim/README.md. Comments are whole lines only (no inline comments).
;
; Sources and method (WP F4):
; Flap placard speeds (VFE 230/215/200/185 kt for 1/2/3/FULL) and Vmo 350 kt / Mmo 0.82 are the
; commonly published A320 limits (public type-rating summaries, no AFM in the repo): ESTIMATES.
; The model has flap travel 0..40 degrees in the order 0, 1, 2, 5, 10, 15, 25, 30, 40; the real
; A320 detents are mapped onto it as 1 = 5, 2 = 10, 3 = 25, FULL = 40 degrees (approximation).
; Stall speeds, rotation and approach speeds are MEASURED on the model with tests/fleet (idle
; deceleration at 1 g, see tests/fleet/README.md). The model is not tuned toward the real airplane.
[aircraft]
id = A320
display_name = Airbus A320-200
jsbsim_model = A320
category = jet
engines = 2
retractable_gear = true
speedbrake = true
reversers = true
autothrottle = true

[flaps]
detents = UP:0.0, 1:0.125, 2:0.25, 3:0.625, FULL:1.0
vfe_kt = 0, 230, 215, 200, 185
takeoff_detent = 3
approach_detent = 4

[speeds_kt]
; Measured: Vs1 = clean 174 (control-limited: the elevator runs out at alpha 8.9, see tests/fleet/README.md), Vs0 = 150
; with full flaps, flaps 3 liftoff at about 170 kt. Vr 166 keeps Vr above 1.1 x Vs0. Vapp = 1.15 x the
; full flap speed, Vref = Vapp - 5.
vs0 = 150
vs1 = 174
vr = 166
vref = 168
vapp = 173
vfe = 230
vmo = 350
mmo = 0.82

[cruise]
ias_kt = 250
altitude_ft = 33000

[warnings]
; The model never reaches its stall: alpha tops out at 8.9 clean and 6.8 with full flaps, so the
; warning is set under those.
stall_warn_alpha_deg = 6.0

[properties]
structure_contacts = TAIL_1, ENG_1, ENG_2, WING_TIP_1, WING_TIP_2, NOSE_TIP, NOSE_TOP, TAIL_TOP, TAIL_TIP

[crash]
hard_landing_fpm = 1100
touchdown_bank_deg = 12
touchdown_pitch_up_deg = 12
touchdown_pitch_down_deg = 8

[ground]
steer_full_below_kt = 15
steer_min_above_kt = 80
steer_min_frac = 0.1

[autopilot]
; WP F4. The stall warning alpha is low, so the angle-of-attack limit (default warning - 2.5) would cut the
; pitch demand in a turn: it is set explicitly. A/T gains are raised from the jet defaults because the
; default gains left a slow speed and path oscillation on the ILS (src/autopilot/README.md has the keys).
at_kp = 0.06
at_ki = 0.012
at_slew_per_s = 0.5
alpha_limit_deg = 5.5
bank_limit_deg = 25
heading_tau_s = 4.5
nav_tau_s = 25
vs_default_fpm = 1500
vs_max_climb_fpm = 3000
vs_max_descent_fpm = 3000
