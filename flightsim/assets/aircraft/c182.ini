; Cessna 182S Skylane (JSBSim stock model "c182", IO-540 230 hp, fixed tricycle gear, about 2,600 lb).
; Format reference: src/sim/README.md. Comments are whole lines only (no inline comments).
;
; Sources and method (WP F4):
; Vne 175 kt, Vno 140 kt, Vfe 140 / 110 kt and the stall figures 54 / 49 kt are the commonly
; published 182S numbers from the model's README.c182 and public POH summaries (no POH in the
; repo): ESTIMATES. The model's flaps run 0, 10, 20, 30 degrees (command = degrees / 30).
; Rotation and approach speeds are MEASURED on the model with tests/fleet.
[aircraft]
id = c182
display_name = Cessna 182S Skylane
jsbsim_model = c182
category = piston
engines = 1
retractable_gear = false
speedbrake = false
reversers = false
autothrottle = false

[flaps]
detents = UP:0.0, 10:0.3333, 20:0.6667, 30:1.0
vfe_kt = 0, 140, 110, 110
takeoff_detent = 1
approach_detent = 2

[speeds_kt]
vs0 = 49
vs1 = 54
vr = 55
vref = 65
vapp = 70
vfe = 110
vno = 140
vne = 175

[cruise]
ias_kt = 110
altitude_ft = 6500

[warnings]
stall_warn_alpha_deg = 11

[properties]
structure_contacts = TAIL_SKID, LEFT_TIP, RIGHT_TIP

[crash]
hard_landing_fpm = 900
touchdown_bank_deg = 25
touchdown_pitch_up_deg = 20
touchdown_pitch_down_deg = 15

[ground]
steer_full_below_kt = 15
steer_min_above_kt = 60
steer_min_frac = 0.15

[autopilot]
at_available = 1
bank_limit_deg = 20
heading_tau_s = 3.5
nav_tau_s = 20
pitch_kp = 0.08
pitch_kd = 0.06
vs_default_fpm = 500
vs_max_climb_fpm = 1000
vs_max_descent_fpm = 1200
min_climb_ias_kt = 65
