; Default controls for the flight sim (docs/CONTROLS.md is the human-readable spec).
; A user override lives in <conf dir>/controls.ini: any "Action = ..." line there REPLACES that
; action's bindings in the same section; everything else keeps these defaults.
; Comments are whole lines starting with ';' or '#'. There are no inline comments.
;
; Format
;   [pad.base] [pad.l1] [pad.r1] [pad.l2]   gamepad bindings per shift layer. Layer = which
;       modifier is held (L2 beats L1 beats R1). A layer only fires its own bindings.
;       Action = input, input     input names: a b x y dpad_up dpad_down dpad_left dpad_right
;                                 l1 r1 l2 r2 select start l3 r3 (the label PRINTED on the device)
;       axis.<Axis> = [-]stick    stick: leftx lefty rightx righty ('-' inverts)
;   [pad.chords]    Action = input+input
;   [key.base] [key.l2]   desktop keyboard (ignored when FLIGHTSIM_PLATFORM=portmaster).
;       Action = key, shift+key, ctrl+key    SDL key names. key.l2 is active while the
;       [key.layers] look key is held.
;       axis.<Axis>.neg / axis.<Axis>.pos = key, key
;
; Sign conventions: Pitch +1 = stick back = nose up (SDL left stick Y positive = down = back, so
; no inversion). ThrottleRate +1 = increase (stick up = SDL negative, hence '-righty').

; ---------------------------------------------------------------------------------------------
; DEVICE LABEL TABLE. The ONLY place that assumes how the RG40XXH labels map to SDL buttons.
; Left = label printed on the device (all bindings below use these labels).
; Right = SDL GameController button that label produces.
; ASSUMPTION (unverified until the P1 device probe): Anbernic prints a Nintendo-style layout while
; SDL names the face buttons by position in an Xbox layout, so printed A (right) = SDL b,
; printed B (bottom) = SDL a, printed X (top) = SDL y, printed Y (left) = SDL x.
; If the probe log shows the printed labels equal SDL names, change these four lines to a = a,
; b = b, x = x, y = y. Nothing else needs to change. l2 and r2 are analog triggers in SDL and
; are listed for documentation only.
; ---------------------------------------------------------------------------------------------
[device_labels]
a = b
b = a
x = y
y = x
dpad_up = dpup
dpad_down = dpdown
dpad_left = dpleft
dpad_right = dpright
l1 = leftshoulder
r1 = rightshoulder
l2 = lefttrigger
r2 = righttrigger
select = back
start = start
l3 = leftstick
r3 = rightstick

[axes]
left_deadzone = 0.08
left_expo = 0.35
right_deadzone = 0.12
right_expo = 0.0
; Right stick: when one axis exceeds the other by this ratio the weaker axis is zeroed.
dominance_ratio = 1.5
; Analog triggers count as pressed above trigger_on and released below trigger_off.
trigger_on = 0.5
trigger_off = 0.3
; Keyboard stick emulation: ramp toward full deflection, spring back on release (per second).
key_ramp_per_s = 2.0
key_return_per_s = 4.0

[repeat]
actions = HdgBugDec, HdgBugInc, AltBugDec, AltBugInc, MenuUp, MenuDown, MenuLeft, MenuRight
delay_s = 0.4
interval_s = 0.15
min_interval_s = 0.05
decay = 0.85

[double_tap]
action = Brakes
fires = ParkingBrake
window_s = 0.3

[pad.base]
axis.Pitch = lefty
axis.Roll = leftx
axis.Rudder = rightx
axis.ThrottleRate = -righty
TrimNoseDown = dpad_up
TrimNoseUp = dpad_down
FlapsUp = dpad_left
FlapsDown = dpad_right
GearToggle = a
Brakes = b, r2
SpeedbrakeCycle = x
HudDeclutter = y
MapToggle = select
Pause = start
MenuUp = dpad_up
MenuDown = dpad_down
MenuLeft = dpad_left
MenuRight = dpad_right
MenuAccept = a
MenuBack = b

; L1 held: autopilot layer. NavMode is the NAV/APR toggle (AprMode is left unbound).
[pad.l1]
axis.Pitch = lefty
axis.Roll = leftx
axis.BugRate = -righty
ApToggle = a
AtToggle = b
HdgMode = x
NavMode = y
HdgBugDec = dpad_left
HdgBugInc = dpad_right
AltBugInc = dpad_up
AltBugDec = dpad_down
AltMode = r2
DirectTo = select

; R1 held: systems layer.
[pad.r1]
axis.Pitch = lefty
axis.Roll = leftx
RudderTrimLeft = dpad_left
RudderTrimRight = dpad_right
ReverseToggle = a
FdToggle = b
SyncBugs = x
NavSourceCycle = y

; L2 held: look layer (LookHold is raised automatically). Right stick does not touch throttle
; or rudder here.
[pad.l2]
axis.Pitch = lefty
axis.Roll = leftx
axis.LookYaw = rightx
axis.LookPitch = -righty
LookLeft = dpad_left
LookRight = dpad_right
LookBack = dpad_down
LookDown = dpad_up

[pad.chords]
Quit = select+start

[key.layers]
look = v

[key.base]
axis.Pitch.neg = up
axis.Pitch.pos = down
axis.Roll.neg = left
axis.Roll.pos = right
axis.Rudder.neg = q
axis.Rudder.pos = e
axis.ThrottleRate.neg = s, pagedown
axis.ThrottleRate.pos = w, pageup
TrimNoseDown = home
TrimNoseUp = end
FlapsUp = [
FlapsDown = ]
GearToggle = g
Brakes = b
ParkingBrake = shift+b
SpeedbrakeCycle = /
ReverseToggle = r
HudDeclutter = tab
MapToggle = m
Pause = escape, p
Screenshot = f12
ApToggle = f1
AtToggle = f2
HdgMode = f3
NavMode = f4
FdToggle = f5
HdgBugDec = -
HdgBugInc = =
AltBugDec = 9
AltBugInc = 0
Quit = ctrl+q
MenuUp = up
MenuDown = down
MenuLeft = left
MenuRight = right
MenuAccept = return
MenuBack = backspace

; V held + arrows: free look.
[key.l2]
axis.LookYaw.neg = left
axis.LookYaw.pos = right
axis.LookPitch.neg = down
axis.LookPitch.pos = up
