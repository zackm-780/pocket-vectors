; flightsim default settings. Do not edit: put overrides in <conf dir>/settings.ini, which is
; loaded on top of this file and rewritten by the game (unknown keys and comments are kept).
; Comments are whole lines; values are verbatim. Precedence: command line > settings.ini > this file.
[settings]
; Terrain/nav data root. Empty = <asset root>/data. The --data-dir option overrides it.
data_dir =
; Vertical field of view of the 3D view in degrees (30..110).
fov_vertical_deg = 55
; true shows the frame rate (window title and log). The --show-fps option also turns it on.
show_fps = false
; HUD color: green | white | amber
hud_color = green
; HUD declutter level at start: full | std | min
hud_declutter_default = std
; Track-up route inset on the HUD (off until turned on). Range 0 follows the next waypoint
; between 2 and 20 NM; any other value is a fixed range in that same span.
hud_mini_nav = false
hud_mini_nav_range_nm = 0
; Altimeter setting units: hpa | inhg
pressure_units = hpa
; Fixed simulation rate: 120 | 60
sim_hz = 120
; Rendering detail: low | med | high
graphics_quality = med
; Master volume 0..100
volume_pct = 80
; Auto-rudder: coordinates turns in flight and steers on the ground with the roll axis.
assist_auto_rudder = false
; Auto-trim (F9, not realistic): with the stick centred for 1 s the trim holds the flight path
; you left (off on the ground and with the AP engaged; a trim press takes over).
assist_auto_trim = false
; Pitch damper (F9, not realistic): pitch-rate damping while the stick is near the centre.
assist_pitch_damper = false
; Throttle: rate (right stick Y changes throttle) | absolute (stick position = throttle).
throttle_mode = rate
; Stick sensitivity per axis (0.25..2, 1 = unchanged), applied after expo.
pitch_sensitivity = 1
roll_sensitivity = 1
rudder_sensitivity = 1
; Extra stick expo per axis (0 = linear .. 1 = cubic), on top of controls.ini.
pitch_expo = 0
roll_expo = 0
rudder_expo = 0
; Weather (X1): use a METAR file <data>/weather/<ICAO>.txt for the start airport, gusts, and
; light turbulence 0..1 (a scenario [weather] turbulence key wins).
weather_metar = true
weather_gusts = true
weather_turbulence = 0
; World overlays (W6). Route and path: auto (shown only at FULL HUD declutter), on or off (H10).
; Airports and runways are off until turned on. Radius is 5..80 NM.
overlay_route = auto
overlay_vpath = auto
overlay_airports = false
overlay_runways = false
overlay_airport_radius_nm = 25
; External chase view (V1) instead of the cockpit; L2 + L3 (C on the keyboard) toggles it.
external_view = false
; Clouds (W7): auto = the scenario's [clouds], else the METAR; off; or one manual layer
; (few, sct, bkn, ovc) at cloud_base_ft above the field.
clouds = auto
cloud_base_ft = 2500
; GPWS callouts (S2): spoken ("five hundred", "sink rate", "pull up") or the plain tones.
gpws_voice = true
; Audio buffer in samples, read at start: 0 = automatic (1024 on the handheld, 512 elsewhere), or
; 256 / 512 / 1024 / 2048 / 4096. Larger stops crackle (ALSA underruns) and adds a little delay.
audio_buffer_samples = 0
; Performance measurement (X3): true waits for the GPU after each render pass, so the frame timing
; in the log (show_fps) splits GPU time by pass. Lowers the frame rate; read at start.
perf_gpu_sync = false
; Aircraft id of the last flight; written by the game on exit.
last_aircraft =
